# Rotation des logs Docker (json-file) partagée par tous les services : sans
# elle, les logs de conteneurs grossissent sans limite et remplissent le disque
# (→ Postgres en read-only, API en 500). Appliquée via `logging: *default-logging`.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

networks:
  telecom_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  grafana_data:
  prometheus_data:
  logs_data:

services:

  # ── NGINX ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: telecom_nginx
    logging: *default-logging
    mem_limit: 128m
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/ssl:/etc/nginx/ssl:ro
      - logs_data:/var/log/nginx
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    networks: [telecom_net]
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── NEXT.JS ───────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: telecom_web
    logging: *default-logging
    mem_limit: 768m
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # Next.js standalone écoute sur $HOSTNAME (Docker le fixe à l'ID du conteneur) :
      # on force 0.0.0.0 pour que le healthcheck (localhost) et nginx joignent web.
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1
      NEXT_PUBLIC_WS_URL: wss://${DOMAIN}
      NEXTAUTH_URL: https://${DOMAIN}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      # Appel API interne (réseau Docker) pour le login côté serveur :
      # évite que NextAuth ne sorte vers le certificat auto-signé via Nginx.
      API_INTERNAL_URL: http://api:3001/v1
    expose: ["3000"]
    depends_on: [api]
    networks: [telecom_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── NODE.JS API ───────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: telecom_api
    logging: *default-logging
    mem_limit: 1g
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: telecom-files
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY}
      CORS_ORIGIN: https://${DOMAIN}
      # Base publique pour les URLs de fichiers MinIO (photos, signatures, PDF).
      # Sans ça l'API génère http://localhost:3000/storage/... (vignettes vides).
      APP_URL: https://${DOMAIN}
    expose: ["3001"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [telecom_net]
    volumes:
      - logs_data:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── POSTGRESQL + TIMESCALEDB ──────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: telecom_postgres
    logging: *default-logging
    mem_limit: 3g
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/scripts/init-timescale.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    expose: ["5432"]
    networks: [telecom_net]
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c maintenance_work_mem=256MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c work_mem=4MB
      -c log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── REDIS ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: telecom_redis
    logging: *default-logging
    mem_limit: 1280m
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes: [redis_data:/data]
    expose: ["6379"]
    networks: [telecom_net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MINIO ─────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: telecom_minio
    logging: *default-logging
    mem_limit: 512m
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes: [minio_data:/data]
    expose: ["9000", "9001"]
    networks: [telecom_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── PROMETHEUS ────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: telecom_prometheus
    logging: *default-logging
    mem_limit: 512m
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose: ["9090"]
    networks: [telecom_net]

  # ── GRAFANA ───────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: telecom_grafana
    logging: *default-logging
    mem_limit: 256m
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    expose: ["3000"]
    depends_on: [prometheus]
    networks: [telecom_net]
