worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Taille max upload (photos, PDF)
    client_max_body_size 20M;
    client_body_buffer_size 128k;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml application/atom+xml image/svg+xml;

    # Rate limiting
    # 300 r/m par IP : la limite est PAR ADRESSE, or une agence entière partage
    # une IP publique (NAT), et la recette E2E a prouvé qu'UN SEUL utilisateur
    # rapide saturait les 60 r/m d'origine (tableaux de bord = plusieurs
    # requêtes par page). L'anti-bruteforce du login reste, lui, sur auth_limit.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=300r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    # Lectures de session NextAuth (/api/auth/session, csrf, signout…) : appelées
    # en continu par le portail (SessionProvider + un getSession par requête API).
    # Elles étaient sous auth_limit (10 r/m) : au-delà, 429 → session cliente
    # NULLE → menu vide, requêtes sans jeton, et même le signOut de secours
    # (csrf + signout, même zone) échouait — l'interface restait figée à moitié
    # morte. Généreuse à dessein : plusieurs agences partagent une même IP (NAT).
    limit_req_zone $binary_remote_addr zone=authjs_session_limit:10m rate=600r/m;
    limit_req_zone $binary_remote_addr zone=storage_limit:10m rate=300r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Buffer
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    include /etc/nginx/conf.d/*.conf;
}
