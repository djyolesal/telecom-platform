# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name emops.uk www.emops.uk;
    # Validation Let's Encrypt (renouvellement webroot, sans arrêter nginx).
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# Serveur principal HTTPS
server {
    listen 443 ssl http2;
    server_name emops.uk www.emops.uk;

    # Certificat Let's Encrypt (monté depuis /etc/letsencrypt sur l'hôte). Le
    # renouvellement met à jour ces fichiers directement → un simple restart nginx.
    ssl_certificate     /etc/letsencrypt/live/emops.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emops.uk/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Sécurité
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Résolveur DNS interne Docker : nginx re-résout l'IP des conteneurs (sinon il
    # met en cache l'IP au démarrage → 502 « upstream injoignable » dès qu'un
    # conteneur est recréé avec une nouvelle IP). Le proxy_pass via variable force
    # cette résolution dynamique pour le portail web.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web_upstream http://web:3000;
    # Idem pour l'API : re-résolution dynamique de l'IP du conteneur (sinon 502
    # « upstream injoignable » dès que l'API est recréée avec une nouvelle IP,
    # ex. après un rebuild). Une variable dans proxy_pass force le resolver.
    set $api_upstream http://api:3001;
    # Grafana : re-résolution dynamique aussi (même motif que web/api).
    set $grafana_upstream http://grafana:3000;

    # ── NextAuth (/api/auth/*) → Next.js (web), PAS l'API Express ──
    # Doit précéder /api/ : NextAuth sert ses routes depuis le portail web.
    location /api/auth/ {
        # Anti-bruteforce du login web (NextAuth) : même zone que l'API mobile.
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API REST /api/ ─────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_conn conn_limit 20;

        # Variable → résolution dynamique. Le préfixe /api est retiré par rewrite
        # (le proxy_pass avec variable ne strippe pas l'URI automatiquement).
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Rate limiting strict sur auth
    location /api/v1/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket Socket.IO ────────────────────────────────────
    location /socket.io/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Objets MinIO (photos, signatures, PDF) ────────────────
    # Restreint AU SEUL bucket applicatif : /storage/telecom-files/<clé>. On ne
    # proxifie plus /storage/ (racine S3) — plus de listing/accès aux autres
    # buckets. Rate-limit dédié + méthodes lecture seule (pas de PUT/DELETE via
    # cette voie). NB : les objets restent en lecture publique par URL ; migrer
    # vers des URLs signées si les signatures doivent devenir privées.
    location /storage/telecom-files/ {
        limit_req zone=storage_limit burst=60 nodelay;
        limit_except GET HEAD { deny all; }
        proxy_pass http://minio:9000/telecom-files/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }
    # Toute autre tentative sous /storage/ (autre bucket, racine) → refus.
    location /storage/ {
        deny all;
        return 403;
    }

    # ── MinIO console (FERMÉE au public) ───────────────────────
    # La console d'admin du stockage (identifiants root S3) NE DOIT PAS être
    # exposée sur Internet. Accès par tunnel SSH : ssh -L 9001:localhost:9001 …
    # Pour l'ouvrir à un réseau d'admin précis, remplacer `deny all` par une
    # allowlist (allow <ip>; deny all;).
    location /minio/ {
        deny all;
        return 403;
    }

    # ── Grafana monitoring ──────────────────────────────────────
    # Servi derrière le LOGIN GRAFANA (GRAFANA_USER/GRAFANA_PASSWORD du .env,
    # inscriptions désactivées). Grafana sert lui-même le sous-chemin /grafana
    # (GF_SERVER_SERVE_FROM_SUB_PATH=true) → on transmet l'URI telle quelle.
    location /grafana/ {
        proxy_pass $grafana_upstream;
        proxy_http_version 1.1;
        # WebSocket (Grafana Live / rafraîchissement des dashboards).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # /grafana sans slash final → redirige vers /grafana/ (sinon 404 du portail).
    location = /grafana { return 301 /grafana/; }

    # ── Next.js (portail web — tout le reste) ──────────────────
    location / {
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache assets statiques Next.js (_next/static)
    location ~* \/_next\/static\/ {
        proxy_pass $web_upstream;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Favicon + robots
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
