global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # API applicative (expose déjà /metrics)
  - job_name: 'telecom-api'
    static_configs:
      - targets: ['api:3001']
    metrics_path: '/metrics'

  # Prometheus lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Hôte : disque, RAM, CPU (essentiel pour l'alerte disque plein)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
