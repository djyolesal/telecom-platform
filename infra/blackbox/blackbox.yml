# Sondes blackbox-exporter : disponibilité externe (HTTPS public) et TCP des
# services internes non instrumentés (Postgres/Redis/MinIO).
modules:
  # HTTPS public : suit les redirections, valide le certificat (expiration
  # exposée via probe_ssl_earliest_cert_expiry), 2xx/3xx attendus.
  http_2xx:
    prober: http
    timeout: 8s
    http:
      valid_status_codes: []          # défaut : 2xx
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      follow_redirects: true
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true           # échoue si la connexion n'est pas en TLS

  # Simple ouverture de socket TCP (service vivant ?).
  tcp_connect:
    prober: tcp
    timeout: 5s
